<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마인크래프트 요리 도우미</title>
    <style>
        body { font-family: sans-serif; background-color: #222; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #333; padding: 20px; border-radius: 10px; }
        input, button { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; text-align: left; background: #111; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🍳 마인크래프트 요리 도우미</h2>
        <p>인벤토리/상자 스크린샷을 업로드하세요.</p>
        
        <input type="text" id="apiKey" placeholder="Gemini API Key를 입력하세요">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="analyzeImage()">재료 분석 및 레시피 추천</button>

        <div id="result">결과가 여기에 표시됩니다.</div>
    </div>

    <script>
        async function analyzeImage() {
            const apiKey = document.getElementById('apiKey').value;
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');

            if (!apiKey) return alert('API Key를 입력해주세요.');
            if (!fileInput.files[0]) return alert('이미지를 선택해주세요.');

            resultDiv.innerText = '스캔 및 분석 중...';

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onloadend = async () => {
                const base64Image = reader.result.split(',')[1];
                const prompt = `
당신은 마인크래프트 요리 도우미 AI입니다.
첨부된 인벤토리/상자 스크린샷을 분석하여 다음 기준에 따라 재료를 감지하고 레시피를 추천해주세요:

1. 기본 요리재료(11종): 밀, 달걀, 설탕, 얼음(일반 얼음만 가능), 우유 양동이, 사탕수수, 감자, 익히지 않은 돼지고기, 그릇, 당근, 갈색 버섯
2. 커스텀 요리재료(12종): 땅굴 포도, 슬라임 시럽, 메마른 옥수수, 탄산 광천수, 황금 버터, 암맥 송로버섯, 발광 석류, 네더 칠리, 네사체 치즈, 지옥불 기름, 마그마 퓌레, 호글린 뒷다리

출력 형식:
- 감지된 재료 및 수량 목록
- 제작 가능한 추천 레시피
- 부족한 재료 팁
`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inline_data: { mime_type: file.type, data: base64Image } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    resultDiv.innerText = text;
                } catch (err) {
                    resultDiv.innerText = '오류 발생: ' + err.message;
                }
            };

            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
